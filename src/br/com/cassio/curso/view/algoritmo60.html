<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 3 - JavaScript</title>
</head>
<body>
    <!--
        Desafio:
        Elaborar um programa que leia o valor
        de um jantar. Calcule e informe
        o valor da taxa do garçom (10%)
        e o valor total a ser pago.
    -->
    <script>
        const jantar = 250;
        const porcentagem = jantar / 100;
        const garçom = porcentagem * 10;
        const total = 250 + garçom;

        alert("Seu jantar ficou em: R$ "+jantar+"\nPorcentagem do garçom: R$ "+garçom+"\nTOTAL: R$ "+total);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>FAQ - Relatório de Dúvidas</title>
    <style>
        /* Configurações de Impressão e Paginação A4 (CSS Paged Media) */
        @page {
            size: A4 portrait;
            margin: 25mm 15mm 20mm 15mm;

            @top-center {
                content: "SENAI — Relatório de Perguntas Frequentes (FAQ)";
                font-family: Arial, Helvetica, sans-serif;
                font-size: 8pt;
                color: #718096;
                border-bottom: 1px solid #e2e8f0;
                padding-bottom: 5px;
            }

            @bottom-right {
                content: "Página " counter(page) " de " counter(pages);
                font-family: Arial, Helvetica, sans-serif;
                font-size: 8pt;
                color: #718096;
            }

            @bottom-left {
                content: "Gerado automaticamente pelo Sistema de Dúvidas";
                font-family: Arial, Helvetica, sans-serif;
                font-size: 8pt;
                color: #a0aec0;
            }
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #2d3748;
            margin: 0;
            padding: 0;
            font-size: 11pt;
            line-height: 1.5;
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #141a6b;
            padding-bottom: 15px;
        }

        .header-title h1 {
            color: #141a6b;
            font-size: 20pt;
            margin: 0 0 5px 0;
        }

        .header-title p {
            color: #4a5568;
            font-size: 10pt;
            margin: 0;
        }

        /* Cada bloco de dúvida */
        .faq-item {
            margin-bottom: 18px;
            padding: 14px 18px;
            border-left: 4px solid #141a6b;
            background-color: #f7fafc;
            border-radius: 0 6px 6px 0;

            /* Impede que o bloco seja quebrado no meio na divisão de páginas */
            page-break-inside: avoid;
        }

        .faq-question {
            font-size: 12pt;
            font-weight: bold;
            color: #141a6b;
            margin-bottom: 6px;
        }

        .faq-number {
            display: inline-block;
            margin-right: 4px;
        }

        .faq-meta {
            font-size: 8.5pt;
            color: #718096;
            margin-bottom: 8px;
        }

        .faq-answer {
            color: #4a5568;
            font-size: 10.5pt;
            margin: 0;
            text-align: justify;
        }

        .empty-message {
            text-align: center;
            font-style: italic;
            color: #a0aec0;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>Perguntas e Respostas (FAQ)</h1>
        <p>Listagem completa das dúvidas registradas no banco de dados</p>
    </div>

    <!-- Loop pelas dúvidas do banco -->
    <div th:if="${not #lists.isEmpty(duvidas)}">
        <div class="faq-item" th:each="d, stat : ${duvidas}">
            <div class="faq-question">
                <span class="faq-number" th:text="${stat.count} + '.'">1.</span>
                <span th:text="${d.texto}">Texto da dúvida</span>
            </div>

            <div class="faq-meta" th:if="${d.dataHora != null}">
                Enviada em:
                <span th:text="${#temporals.format(d.dataHora, 'dd/MM/yyyy HH:mm')}">17/10/2026 09:00</span>
            </div>

            <p class="faq-answer">
                Resposta do professor: Dúvida esclarecida durante a aula / conteúdo abordado em sala.
            </p>
        </div>
    </div>

    <!-- Mensagem caso não haja dúvidas cadastradas -->
    <div class="empty-message" th:if="${#lists.isEmpty(duvidas)}">
        <p>Nenhuma dúvida cadastrada no momento.</p>
    </div>

</body>
</html>

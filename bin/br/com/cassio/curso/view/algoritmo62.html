<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 5 - JavaScript</title>
</head>
<body>
    <!--
        Desafio:
        Elaborar um programa que leia a duração de uma viagem em dias e horas.
        Calcule e informe a duração total da viagem em números de horas.

        Quantos dias? 2 dias
        Quantas horas? 5 horas
        Total em horas: _______

    -->
    <script>
        const dias = prompt("Quantos dias será sua viagem?");
        const horas = prompt("Mais quantas horas?");
        const diasEmHoras = Number(dias) * 24;
        const totalHoras = Number(diasEmHoras) + Number(horas);
        
        alert("Sua viagem será feita em: " + dias + " dias." + "\nE mais " + horas + " horas." + "\nVocê gastará um total de " + totalHoras + " horas em viagem!");
    </script>
</body>
</html>
